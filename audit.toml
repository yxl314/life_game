# cxx_audit 配置 —— life_game
#
# 用法（在仓库根目录）：
#     PYTHONPATH=../cxx_audit/src \
#         python3 -m cpp_audit -c audit.toml all
#
# 单项：
#     ... cpp_audit -c audit.toml tidy
#     ... cpp_audit -c audit.toml cpd
#     ... cpp_audit -c audit.toml asan
#     ... cpp_audit -c audit.toml valgrind

[project]
name = "life_game"
root = "."
sources = ["src"]
excludes = ["build", ".git", ".git-backups", "docs"]
build_system = "qmake"
project_file = "life_game.pro"
build_dir = "build/audit"
target = "lifegame"
qmake = "qmake6"

[compat]
# 本项目明确要求 Qt 6 + C++17；compat 的规则集是面向 C++98 的
# 候选检查，在这里只会产生误报，因此关闭。需要沿用旧代码库时改回 true
# 并恢复默认规则。
enabled = false
rules = []

[tidy]
enabled = true
# clang-tidy 检查集由项目根目录 .clang-tidy 提供。
report = "reports/clang-tidy.txt"
fail_on_warnings = true
# 本机统一限制为 4 路并行。
jobs = 24

[cpd]
enabled = true
dirs = ["src"]
# 70 token 是工具默认值：既能抓出复制粘贴的函数体，又不会被绘制分支的
# 必要结构重复刷屏。当前在 70 token 下无重复。
min_tokens = 70
report = "reports/cpd.txt"

[asan]
# 当前机器是 PRoot-Distro，ASan 运行期会报
#   AddressSanitizer: CHECK failed: sanitizer_allocator_primary64.h
# 这是运行环境限制（cxx_audit README 已说明），不是代码问题。
# 因此默认不纳入 all；ASan 构建仍可用：
#   python3 -m cpp_audit -c audit.toml build --kind asan
# 在普通 Linux 主机上把 enabled 改回 true 即可执行完整运行期检查。
enabled = false
build_dir = "build/asan"
output = "build/asan/bin/lifegame"
compiler = "clang++"
# 必须显式写成 c++17：qmake 会把它追加在 life_game.pri 的选项之后，
# 如果沿用默认的 -std=gnu++0x 会覆盖项目的 C++17 标准。
cxxflags = ["-std=c++17", "-fsanitize=address",
            "-fsanitize-address-use-after-return=always",
            "-fno-omit-frame-pointer", "-g", "-O0"]
ldflags = ["-fsanitize=address"]
checks = ["detect_leaks", "detect_stack_use_after_return"]
options = { halt_on_error = "0", symbolize = "1" }
report = "reports/asan.txt"
timeout_sec = 120

[valgrind]
enabled = true
build_dir = "build/debug"
output = "build/debug/bin/lifegame"
compiler = "clang++"
cxxflags = ["-std=c++17", "-g", "-O0"]
tool = "memcheck"
# 本机 Qt 的 X11/Vulkan 驱动会制造大量未初始化值误报，因此只检查泄漏；
# 未初始化内存问题由 ASan 负责（若运行环境支持）。
checks = ["leaks"]
# libLLVM 在插件/JIT 初始化时会偶发 "possibly lost"；只让 definite/indirect
# 泄漏计入 ERROR SUMMARY，完整 loss record 仍保留在报告里。
extra_args = ["--undef-value-errors=no",
              "--errors-for-leak-kinds=definite,indirect"]
report = "reports/valgrind.txt"
timeout_sec = 600

# GUI 程序没有命令行退出路径：在 :101 上启动 Xvfb + openbox，再用 wmctrl
# 关闭窗口，让 Qt 走正常退出流程（保存会话、执行 atexit），这样才能拿到
# LeakSanitizer / Valgrind 的泄漏汇总。窗口管理器和 wmctrl 缺一不可：
# 没有 WM 时 WM_DELETE_WINDOW 不会送达应用。
[run]
args = []
env = { DISPLAY = ":101", QT_QPA_PLATFORM = "xcb" }
timeout_sec = 120
warmup_sec = 3
pre = [
    "pkill -f '[X]vfb :101' 2>/dev/null || true",
    "Xvfb :101 -screen 0 1280x1024x24 >/tmp/lifegame-audit-xvfb.log 2>&1 &",
    "sleep 1",
    "openbox >/tmp/lifegame-audit-openbox.log 2>&1 &",
    "sleep 1",
]
stop = [
    "i=0; while [ $i -lt 90 ]; do wid=$(xdotool search --name '生命游戏' 2>/dev/null | head -1); if [ -n \"$wid\" ]; then sleep 2; wmctrl -i -c \"$wid\"; exit 0; fi; sleep 1; i=$((i+1)); done; exit 1",
]
post = [
    "pkill -f '[X]vfb :101' 2>/dev/null || true",
]

[reports]
dir = "reports"
