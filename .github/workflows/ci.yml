name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and test (Qt 6, GCC)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          cache: true

      - name: Build
        run: |
          mkdir -p build/ci
          cd build/ci
          qmake6 ../../life_game.pro
          make -j4

      - name: Architecture gate
        run: python3 tools/check_layering.py .

      - name: Tests
        run: ./tests/run_all.sh

      - name: Collect UI screenshot
        if: always()
        run: cp /tmp/lifegame-ui-tests.png build/ui-screenshot.png || true

      - name: Upload UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot
          path: build/ui-screenshot.png
          if-no-files-found: ignore

  sanitizers:
    name: Sanitizers (ASan/UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          cache: true

      - name: Build
        run: |
          mkdir -p build/asan
          cd build/asan
          qmake6 ../../life_game.pro \
            "QMAKE_CXXFLAGS+=-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            "QMAKE_LFLAGS+=-fsanitize=address,undefined"
          make -j4

      - name: Sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
          QMAKE_ARGS: >-
            QMAKE_CXXFLAGS+=-fsanitize=address,undefined
            QMAKE_CXXFLAGS+=-fno-omit-frame-pointer
            QMAKE_CXXFLAGS+=-g
            QMAKE_LFLAGS+=-fsanitize=address,undefined
        run: ./tests/run_all.sh
