# cxx_ci 配置 —— life_game
#
# 在仓库根目录运行：
#     python3 ../cxx_ci/check.py ci --root .
#     python3 ../cxx_ci/check.py ci --root . --jobs 8
#
# 主程序是一个 qmake 工程；五个测试各自是独立 .pro，由 tests/run_all.py
# 逐个 qmake + make 并运行，
# 所以测试阶段使用 custom 命令，而不是 qtest 可执行文件列表。

name = "life_game"
build_system = "qmake"
source_dir = "."
project_file = "life_game.pro"
build_dir = "build/ci"

# 测试 runner 把产物放在 build/tests/，clean 阶段一并清理。
clean_paths = ["build/tests"]

[tools]
# make 不显式配置：缺省值由 cxx_ci 的平台层按平台选（POSIX 用 make，
# Windows 用 mingw32-make/nmake），显式写 "make" 在 Windows 上不存在。
qmake = "qmake6"

[output]
# 构建只显示警告/错误；测试只显示失败。完整日志在 ci-logs/。
build = "warnings"
test = "failures"
dir = "ci-logs"

[test]
framework = "custom"
# 用 Python 入口而不是 sh：Linux 与 Windows 同一份配置，不依赖 shell。
commands = [["python3", "tests/run_all.py"]]

[test.env]
# tests/run_all.py 自己也会导出；这里显式声明，便于单独调试。
QT_QPA_PLATFORM = "offscreen"
