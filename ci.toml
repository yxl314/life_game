# cxx_ci 配置 —— life_game
#
# 在仓库根目录运行：
#     python3 ../cxx_ci/ci/ci.py -c ci.toml
#     python3 ../cxx_ci/ci/ci.py -c ci.toml --steps clean,configure,build
#
# 主程序是一个 qmake 工程；五个测试各自是独立 .pro，由 tests/run_all.sh
# 逐个 qmake + make 并运行，所以测试阶段使用 custom 命令，而不是 qtest
# 可执行文件列表。

name = "life_game"
build_system = "qmake"
source_dir = "."
project_file = "life_game.pro"
build_dir = "build/ci"
build_args = ["-j6"]

# run_all.sh 把测试产物放在 build/tests/，clean 阶段一并清理。
clean_paths = ["build/tests"]

[tools]
qmake = "qmake6"
make = "make"

[output]
# 构建只显示警告/错误；测试只显示失败。完整日志在 ci-logs/。
build = "warnings"
test = "failures"
dir = "ci-logs"

[test]
framework = "custom"
commands = [["sh", "tests/run_all.sh"]]

[test.env]
# tests/run_all.sh 自己也会导出；这里显式声明，便于单独调试。
QT_QPA_PLATFORM = "offscreen"
